<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101614">
<title>Ride &amp; Révise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800&family=Barlow:wght@400;500;700&display=swap">
<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout : appli sombre « trail de nuit » — hero VTT illustré, onglets en haut, contenu en cartes, lecteur de quiz plein écran */
:root {
  color-scheme: dark;
  --bg: #101614;
  --bg-2: #17201d;
  --surface: #1d2824;
  --surface-2: #26332e;
  --line: #33443d;
  --fg: #eef3ef;
  --muted: #9db0a7;
  --accent: #ff7a2f;      /* orange enduro */
  --accent-ink: #1a0d04;
  --sky: #5cc8d6;
  --dirt: #8a5a3c;
  --ok: #5fd38d;
  --mid: #ffc847;
  --bad: #ff6470;
  --trail-green: #3fbf6a; --trail-blue: #3d8bff; --trail-red: #f0453a; --trail-black: #0b0b0b;
  --f-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 16px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: .01em; margin: 0; text-wrap: balance; text-transform: uppercase; }
h2 { font-size: 30px; line-height: 1; }
h3 { font-size: 22px; line-height: 1.05; }
.eyebrow { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Top bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.logo { font-family: var(--f-display); font-style: italic; font-weight: 800; font-size: 24px; text-transform: uppercase; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo b { color: var(--accent); font-weight: 800; }
.tabs { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 8px 12px; border-radius: 999px; font-family: var(--f-display); font-weight: 600; font-size: 17px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tab .sm { display: none; }
.tab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 640px) {
  .topbar .inner { flex-wrap: wrap; gap: 0; padding-block: 8px 6px; }
  .tabs { margin-left: 0; width: 100%; }
  .tab { flex: 1; padding: 8px 6px; font-size: 16px; }
  .tab .lg { display: none; } .tab .sm { display: inline; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; }
  .stat { min-width: 0; }
}

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.hero-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-art svg { width: 100%; height: 100%; display: block; }
.hero-photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 45%, transparent 100%); }
.hero .inner { position: relative; padding-block: 34px 30px; display: flex; flex-direction: column; gap: 14px; min-height: 260px; justify-content: flex-end; }
.hero h1 { font-size: clamp(40px, 9vw, 76px); line-height: .9; font-style: italic; max-width: 12ch; }
.hero h1 span { color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 10px; }
.stat { background: color-mix(in srgb, var(--surface) 86%, transparent); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; min-width: 112px; }
.stat .v { font-family: var(--f-display); font-weight: 800; font-size: 28px; line-height: 1; }
.stat .l { font-size: 13px; color: var(--muted); }

main { padding-block: 26px 60px; }
.view { display: flex; flex-direction: column; gap: 22px; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

/* ---------- Cards / grids ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.subject { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 0; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, border-color .15s; }
@media (hover: hover) { .subject:hover { transform: translateY(-2px); border-color: var(--sc); } }
.subject .band { height: 64px; background: var(--sc); position: relative; overflow: hidden; }
.subject .band svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.subject .body { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 4px; }
.subject .meta { font-size: 14px; color: var(--muted); }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--sc, var(--accent)); }

.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 15px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--sky); text-decoration: underline; text-underline-offset: 3px; }
.lesson-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
@media (hover: hover) { .lesson-row:hover { border-color: var(--accent); } }
.lesson-row .t { flex: 1; min-width: 0; }
.lesson-row .t b { font-family: var(--f-display); font-size: 22px; text-transform: uppercase; display: block; line-height: 1.05; }
.lesson-row .chev { font-size: 22px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 10px; }

.split { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .split { grid-template-columns: 1.3fr 1fr; } }
.qv { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.qv:first-of-type { border-top: 0; }
.qv .t { flex: 1; min-width: 150px; }
.qv .t b { display: block; font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 10px 18px; min-height: 46px; font-family: var(--f-display); font-weight: 800; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.small { min-height: 36px; padding: 6px 12px; font-size: 15px; }
.btn.danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 50%, transparent); }
.btn:disabled { opacity: .5; cursor: default; }
.map-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--fg); text-decoration: none; }
.map-item .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--sky); color: var(--bg); display: grid; place-items: center; font-weight: 800; flex: none; font-family: var(--f-display); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.note { font-family: var(--f-display); font-weight: 800; font-size: 20px; padding: 2px 10px; border-radius: 10px; white-space: nowrap; }
.n-ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.n-mid { background: color-mix(in srgb, var(--mid) 18%, transparent); color: var(--mid); }
.n-bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.trail { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.trail i { width: 12px; height: 12px; border-radius: 3px; transform: rotate(45deg); display: inline-block; border: 1.5px solid var(--fg); }

/* Empty */
.empty { border: 2px dashed var(--line); border-radius: var(--r); padding: 26px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty b { color: var(--fg); font-family: var(--f-display); font-size: 22px; text-transform: uppercase; }

/* ---------- Dashboard ---------- */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi .v { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; }
.kpi .l { color: var(--muted); font-size: 14px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--f-body); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .avg-l { stroke: var(--sky); stroke-width: 1.5; stroke-dasharray: 5 4; }
.subj-bars { display: flex; flex-direction: column; gap: 12px; }
.subj-bar { display: grid; grid-template-columns: minmax(80px, 140px) 1fr 54px; gap: 10px; align-items: center; font-size: 15px; }
.subj-bar .track { height: 12px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.subj-bar .track i { display: block; height: 100%; border-radius: 99px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; min-width: 620px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 15px; vertical-align: middle; }
th { font-family: var(--f-display); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--muted); background: var(--bg-2); }
tr:last-child td { border-bottom: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ---------- Parents ---------- */
.form { display: flex; flex-direction: column; gap: 12px; }
.row { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .row.two { grid-template-columns: 1fr 1fr; } }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; min-width: 0; }
label.f span.h { font-weight: 400; color: var(--muted); font-size: 13px; }
input[type=text], select, textarea { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
input[type=file] { background: var(--bg-2); border: 1px dashed var(--line); border-radius: 10px; padding: 12px; width: 100%; }
input[type=color] { width: 54px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); padding: 4px; }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 14px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.tree { display: flex; flex-direction: column; gap: 12px; }
.tree details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.tree summary { cursor: pointer; padding: 10px 0; font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; list-style: none; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .dot { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.tree .lesson { border-top: 1px solid var(--line); padding: 10px 0; display: flex; flex-direction: column; gap: 6px; }
.tree .item { display: flex; align-items: center; gap: 8px; font-size: 15px; flex-wrap: wrap; }
.tree .item .grow { flex: 1; min-width: 120px; }
code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
pre { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 0; white-space: pre; }
.notice { font-size: 14px; color: var(--muted); }

/* ---------- Player overlay ---------- */
.player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; }
.player-bar { display: flex; align-items: center; gap: 10px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
.player-bar .t { flex: 1; min-width: 0; }
.player-bar .t b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-bar .t span { font-size: 13px; color: var(--muted); }
.player iframe { flex: 1; width: 100%; border: 0; background: #fff; }
.player img.mapimg { flex: 1; width: 100%; object-fit: contain; min-height: 0; background: #fff; }
.scorebar { border-top: 1px solid var(--line); background: var(--bg-2); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.scorebar input { width: 70px; min-height: 44px; text-align: center; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.scorebar .lbl { font-weight: 700; }
.scorebar .grow { flex: 1; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; background: var(--fg); color: var(--bg); font-weight: 700; padding: 12px 18px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: calc(100% - 32px); text-align: center; }
.banner { background: color-mix(in srgb, var(--mid) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--mid) 40%, transparent); color: var(--fg); border-radius: 12px; padding: 10px 14px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- GitHub/Firebase additions ---------- */
.setup { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.setup ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.lock { max-width: 360px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.lock input { text-align: center; font-size: 24px; letter-spacing: .3em; max-width: 200px; }
.syncdot { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.syncdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.syncdot.on i { background: var(--ok); } .syncdot.off i { background: var(--bad); }

/* ---------- Photos ---------- */
.hero { min-height: 340px; }
.hero .inner { min-height: 340px; }
.hero-photo { background-color: var(--bg-2); background-position: 72% 40%; }
.hero-photo::after { background:
  linear-gradient(90deg, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--bg) 55%, transparent) 42%, transparent 72%),
  linear-gradient(0deg, var(--bg) 0%, transparent 38%); }
@media (max-width: 640px) {
  .hero-photo { background-position: 78% 30%; }
  .hero-photo::after { background: linear-gradient(0deg, var(--bg) 6%, color-mix(in srgb, var(--bg) 70%, transparent) 50%, color-mix(in srgb, var(--bg) 20%, transparent) 100%); }
  .hero .inner { min-height: 420px; }
}
.hero h1 { text-shadow: 0 2px 18px rgba(0,0,0,.45); }
.hero .eyebrow { text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.subject .band { height: 132px; background-size: cover; background-position: center; background-color: var(--surface-2); }
.subject .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, color-mix(in srgb, var(--surface) 70%, transparent) 0%, transparent 55%); box-shadow: inset 0 -4px 0 var(--sc); }
@media (hover: hover) { .subject .band { transition: background-size .4s; } }
.page-hero { position: relative; overflow: hidden; border-radius: var(--r); min-height: 190px; background-size: cover; background-position: center; background-color: var(--surface-2); display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 20px; border: 1px solid var(--line); }
.page-hero.tall { min-height: 260px; }
.page-hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--bg) 45%, transparent) 55%, color-mix(in srgb, var(--bg) 10%, transparent) 100%); }
.page-hero > * { position: relative; }
.page-hero h2 { font-size: clamp(32px, 6vw, 48px); font-style: italic; text-shadow: 0 2px 14px rgba(0,0,0,.5); }
.page-hero .ph-in { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.page-hero .ph-sub { margin: 2px 0 0; color: var(--fg); opacity: .85; font-weight: 500; }
.page-hero .eyebrow { text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.subj-thumb { height: 70px; border-radius: 10px; background-size: cover; background-position: center; margin-bottom: 8px; }
.lock { margin-top: 0; }

/* ---------- Planning ---------- */
.pl-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.pl-nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pl-nav b { font-size: 16px; }
.pl-nav .btn.small { min-width: 40px; }
.pl-sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pl-legend { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; margin-left: auto; }
.pl-week { display: none; }
.pl-day { display: flex; flex-direction: column; gap: 10px; }
@media (min-width: 860px) {
  .pl-week { display: grid; grid-template-columns: 50px repeat(7, minmax(0, 1fr)); gap: 4px; }
  .pl-day { display: none; }
}
.pl-corner { }
.pl-dh { text-align: center; padding: 6px 2px; border-radius: 10px; display: flex; flex-direction: column; line-height: 1.1; }
.pl-dh b { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--muted); }
.pl-dh span { font-family: var(--f-display); font-weight: 800; font-size: 22px; }
.pl-dh.today { background: var(--accent); color: var(--accent-ink); }
.pl-dh.today b { color: var(--accent-ink); }
.pl-h { font-size: 13px; color: var(--muted); text-align: right; padding: 6px 6px 0 0; }
.pl-cell { min-height: 58px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 3px; text-align: left; display: flex; align-items: stretch; min-width: 0; color: var(--fg); }
.pl-cell.today { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.pl-cell .pl-plus { margin: auto; color: var(--muted); opacity: 0; font-size: 20px; transition: opacity .15s; }
@media (hover: hover) { .pl-cell:hover { border-color: var(--accent); } .pl-cell:hover .pl-plus { opacity: 1; } }
.pl-block { flex: 1; min-width: 0; border-radius: 7px; padding: 4px 6px; background: color-mix(in srgb, var(--sc) 22%, var(--surface)); border-left: 3px solid var(--sc); display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
.pl-block.done { opacity: .72; }
.pl-block.missed { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--sc) 14%, var(--surface)) 0 8px, color-mix(in srgb, var(--sc) 6%, var(--surface)) 8px 16px); }
.pl-t { font-weight: 700; font-size: 13px; line-height: 1.2; display: flex; align-items: center; gap: 4px; justify-content: space-between; }
.pl-d, .pl-n { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl-n { font-style: italic; }
.pl-st { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font-size: 11px; font-weight: 800; flex: none; }
.pl-st.ok { background: var(--ok); color: var(--bg); }
.pl-st.miss { background: var(--bad); color: var(--bg); }
.pl-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.pl-dchip { position: relative; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 6px 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; color: var(--fg); }
.pl-dchip b { font-family: var(--f-display); font-size: 13px; text-transform: uppercase; color: var(--muted); }
.pl-dchip span { font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.pl-dchip.today { border-color: var(--accent); }
.pl-dchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pl-dchip.on b { color: var(--accent-ink); }
.pl-dchip i { position: absolute; top: -5px; right: -3px; background: var(--sky); color: var(--bg); font-style: normal; font-size: 11px; font-weight: 800; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; }
.pl-list { display: flex; flex-direction: column; gap: 6px; }
.pl-row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: stretch; }
.pl-row .pl-cell { min-height: 52px; }
.pl-row .pl-cell .pl-plus { opacity: .5; }
.pl-row .pl-t { font-size: 15px; }
.pl-row .pl-d, .pl-row .pl-n { font-size: 13px; }
.pl-sheet { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.55); display: flex; align-items: flex-end; justify-content: center; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.pl-panel { width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; }
@media (min-width: 640px) { .pl-sheet { align-items: center; } .pl-panel { border-radius: 18px; padding-bottom: 18px; } }
.pl-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.pl-check { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.pl-check input { width: 22px; height: 22px; accent-color: var(--ok); }
.pl-hour { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--accent); min-width: 44px; }
@media (max-width: 640px) { .tabs { gap: 2px; } .tab { flex: 1 1 auto; font-size: 13px; padding: 7px 5px; letter-spacing: 0; } }
@media (max-width: 360px) { .tab { font-size: 12px; padding: 7px 3px; } }
@media (max-width: 640px) { .pl-btns .btn { flex: 1 1 calc(50% - 4px); } }
</style>
</head>
